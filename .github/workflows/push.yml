name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.19
    strategy:
      fail-fast: true
      matrix:
        model:
          [
            "TS100",
            "TS80",
            "TS80P",
            "Pinecil",
            "MHP30",
            "Pinecilv2",
            "S60",
            "S60P",
            "T55",
            "TS101",
          ]

    steps:
      - name: Install dependencies (apk)
        run: |
          apk add --no-cache \
            gcc-riscv-none-elf g++-riscv-none-elf \
            gcc-arm-none-eabi g++-arm-none-eabi \
            newlib-riscv-none-elf newlib-arm-none-eabi \
            findutils python3 py3-pip make git bash

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Git ownership exception
        run: |
          git config --global --add safe.directory /__w/IronOS/IronOS
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ${{ matrix.model }} (EN only)
        run: |
          cd source
          ./build.sh -m ${{ matrix.model }} -l EN

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Generate json index file
        run: ./source/metadata.py ${{ matrix.model }}.json

      - name: Archive ${{ matrix.model }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}
          path: |
            source/Hexfile/${{ matrix.model }}_*.hex
            source/Hexfile/${{ matrix.model }}_*.dfu
            source/Hexfile/${{ matrix.model }}_*.bin
            source/Hexfile/${{ matrix.model }}.json
            source/Hexfile/LICENSE
            source/Hexfile/LICENSE_RELEASE.md
          if-no-files-found: error

  build_multi-lang:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.19
    strategy:
      fail-fast: true
      matrix:
        model: ["Pinecil", "Pinecilv2"]

    steps:
      - name: Install dependencies (apk)
        run: |
          apk add --no-cache \
            gcc-riscv-none-elf g++-riscv-none-elf \
            gcc-arm-none-eabi g++-arm-none-eabi \
            newlib-riscv-none-elf newlib-arm-none-eabi \
            findutils python3 py3-pip make git bash musl-dev

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Git ownership exception
        run: |
          git config --global --add safe.directory /__w/IronOS/IronOS
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ${{ matrix.model }} multi-language
        run: |
          make -C source/ -j$(nproc) \
            model="${{ matrix.model }}" \
            firmware-multi_compressed_European \
            firmware-multi_compressed_Belorussian+Bulgarian+Russian+Serbian+Ukrainian \
            firmware-multi_Chinese+Japanese

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Generate json index file
        run: ./source/metadata.py ${{ matrix.model }}_multi-lang.json

      - name: Archive ${{ matrix.model }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}_multi-lang
          path: |
            source/Hexfile/${{ matrix.model }}_*.hex
            source/Hexfile/${{ matrix.model }}_*.dfu
            source/Hexfile/${{ matrix.model }}_*.bin
            source/Hexfile/${{ matrix.model }}_multi-lang.json
            source/Hexfile/LICENSE
            source/Hexfile/LICENSE_RELEASE.md
          if-no-files-found: error
