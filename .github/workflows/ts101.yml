name: TS101 Build

on:
  push:
    branches: [ts101-build1]
  pull_request:

jobs:
  build-ts101:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.19

    steps:
      # 1️⃣ Git MUST be installed first
      - name: Install base tools
        run: |
          apk add --no-cache \
            git \
            bash \
            make \
            python3 \
            py3-pip \
            findutils \
            gcc-arm-none-eabi \
            g++-arm-none-eabi \
            newlib-arm-none-eabi

      # 2️⃣ Checkout WITH submodules
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 3️⃣ Python dependency
      - name: Python deps
        run: python3 -m pip install --break-system-packages bdflib

      # 4️⃣ Build TS101 EN only (fast & reliable)
      - name: Build TS101 EN
        run: make -C source firmware-EN model=TS101

      # 5️⃣ Licenses
      - name: Copy licenses
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      # 6️⃣ Upload firmware
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TS101-Firmware
          path: source/Hexfile/TS101_*
